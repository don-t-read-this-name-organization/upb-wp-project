databaseChangeLog:
  - changeSet:
      id: "25-add-user-security-columns"
      author: "demesup"
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: last_login
                  type: TIMESTAMP
              - column:
                  name: login_attempts
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: locked_until
                  type: TIMESTAMP
              - column:
                  name: password_expired
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: password_changed_at
                  type: TIMESTAMP
