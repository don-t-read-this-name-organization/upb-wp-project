databaseChangeLog:
  - changeSet:
      id: "31-seed-full-month-schedules"
      author: "demesup"
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              -- Seed full month schedules (4 weeks) for all active users with groups
              
              -- Week 1 - Monday (Week 1)
              INSERT INTO schedules (user_id, course_name, day_of_week, start_time, end_time, location, active)
              SELECT u.id, 'Mathematics I', 'MONDAY', '08:00:00', '10:00:00', 'A101', TRUE
              FROM users u
              WHERE u.active = TRUE AND u.group_id IS NOT NULL
              AND NOT EXISTS (SELECT 1 FROM schedules s WHERE s.user_id = u.id AND s.course_name = 'Mathematics I' AND s.day_of_week = 'MONDAY' AND s.start_time = '08:00:00');
              
              INSERT INTO schedules (user_id, course_name, day_of_week, start_time, end_time, location, active)
              SELECT u.id, 'Physics I', 'TUESDAY', '10:00:00', '12:00:00', 'B202', TRUE
              FROM users u
              WHERE u.active = TRUE AND u.group_id IS NOT NULL
              AND NOT EXISTS (SELECT 1 FROM schedules s WHERE s.user_id = u.id AND s.course_name = 'Physics I' AND s.day_of_week = 'TUESDAY' AND s.start_time = '10:00:00');
              
              INSERT INTO schedules (user_id, course_name, day_of_week, start_time, end_time, location, active)
              SELECT u.id, 'Programming I', 'WEDNESDAY', '12:00:00', '14:00:00', 'C303', TRUE
              FROM users u
              WHERE u.active = TRUE AND u.group_id IS NOT NULL
              AND NOT EXISTS (SELECT 1 FROM schedules s WHERE s.user_id = u.id AND s.course_name = 'Programming I' AND s.day_of_week = 'WEDNESDAY' AND s.start_time = '12:00:00');
              
