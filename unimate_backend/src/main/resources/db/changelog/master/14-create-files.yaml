databaseChangeLog:
  - changeSet:
      id: "14-create-files"
      author: "frihetselsker"
      changes:
        - createTable:
            tableName: files
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: filename
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: display_name
                  type: VARCHAR(255)
              - column:
                  name: folder_id
                  type: INT
              - column:
                  name: file_path
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: file_type
                  type: VARCHAR(20)
              - column:
                  name: file_size
                  type: BIGINT
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: files
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_files_user
        - addForeignKeyConstraint:
            baseTableName: files
            baseColumnNames: folder_id
            referencedTableName: folders
            referencedColumnNames: id
            constraintName: fk_files_folder

