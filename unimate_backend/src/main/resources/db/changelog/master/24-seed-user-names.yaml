databaseChangeLog:
  - changeSet:
      id: "24-seed-user-names"
      author: "frihetselsker"
      changes:
        - update:
            tableName: users
            columns:
              - column:
                  name: first_name
                  value: "Admin"
              - column:
                  name: last_name
                  value: "User"
            where: "username = 'admin'"
        - update:
            tableName: users
            columns:
              - column:
                  name: first_name
                  value: "John"
              - column:
                  name: last_name
                  value: "Student"
              - column:
                  name: faculty_id
                  valueNumeric: 12
            where: "username = 'student'"
        - update:
            tableName: users
            columns:
              - column:
                  name: first_name
                  value: "Maria"
              - column:
                  name: last_name
                  value: "Popescu"
              - column:
                  name: faculty_id
                  valueNumeric: 12
            where: "username = 'sef'"
