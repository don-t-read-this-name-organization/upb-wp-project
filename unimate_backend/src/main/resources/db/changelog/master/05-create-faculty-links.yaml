databaseChangeLog:
  - changeSet:
      id: "05-create-faculty-links-table"
      author: "demesup"
      changes:
        - createTable:
            tableName: faculty_links
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: url
                  type: VARCHAR(2000)
              - column:
                  name: created_at
                  type: TIMESTAMP
