databaseChangeLog:
  - changeSet:
      id: "02-create-groups"
      author: "frihetselsker"
      changes:
        - createTable:
            tableName: student_groups
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: year
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: faculty_id
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            columnNames: name, faculty_id
            tableName: student_groups
            constraintName: uq_groups_name_faculty
        - addForeignKeyConstraint:
            baseTableName: student_groups
            baseColumnNames: faculty_id
            referencedTableName: faculties
            referencedColumnNames: id
            constraintName: fk_groups_faculty
