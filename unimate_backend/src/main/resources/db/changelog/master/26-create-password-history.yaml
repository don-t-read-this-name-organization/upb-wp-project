databaseChangeLog:
  - changeSet:
      id: "26-create-password-history"
      author: "demesup"
      changes:
        - createTable:
            tableName: password_history
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: changed_at
                  type: TIMESTAMP
        - createIndex:
            tableName: password_history
            indexName: idx_password_history_user_changed_at
            columns:
              - column:
                  name: user_id
              - column:
                  name: changed_at
        - addForeignKeyConstraint:
            baseTableName: password_history
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_password_history_user
