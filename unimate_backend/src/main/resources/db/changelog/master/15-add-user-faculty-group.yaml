databaseChangeLog:
  - changeSet:
      id: "15-add-user-faculty-group"
      author: "frihetselsker"
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: faculty_id
                  type: INT
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: group_id
                  type: INT
        - addForeignKeyConstraint:
            baseTableName: users
            baseColumnNames: faculty_id
            referencedTableName: faculties
            referencedColumnNames: id
            constraintName: fk_users_faculty
        - addForeignKeyConstraint:
            baseTableName: users
            baseColumnNames: group_id
            referencedTableName: groups
            referencedColumnNames: id
            constraintName: fk_users_group
