databaseChangeLog:
  - changeSet:
      id: "31-update-notes-structure"
      author: "frihetselsker"
      changes:
        - createTable:
            tableName: note_contents
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: note_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: content_type
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: LONGTEXT
              - column:
                  name: file_path
                  type: varchar(500)
              - column:
                  name: sort_order
                  type: int
                  defaultValue: 0
        - addForeignKeyConstraint:
            baseTableName: note_contents
            baseColumnNames: note_id
            referencedTableName: notes
            referencedColumnNames: id
            constraintName: fk_note_contents_note
        - addColumn:
            tableName: notes
            columns:
              - column:
                  name: collection
                  type: varchar(100)
        - dropColumn:
            tableName: notes
            columnName: content
