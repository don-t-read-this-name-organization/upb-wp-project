databaseChangeLog:
  - changeSet:
      id: "01-create-faculties"
      author: "frihetselsker"
      changes:
        - createTable:
            tableName: faculties
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: short_name
                  type: VARCHAR(50)
              - column:
                  name: website
                  type: VARCHAR(2000)
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            columnNames: name
            tableName: faculties
            constraintName: uq_faculties_name
