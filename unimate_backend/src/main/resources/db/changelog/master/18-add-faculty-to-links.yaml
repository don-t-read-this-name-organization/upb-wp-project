databaseChangeLog:
  - changeSet:
      id: "18-add-faculty-to-links"
      author: "frihetselsker"
      changes:
        - addColumn:
            tableName: faculty_links
            columns:
              - column:
                  name: faculty_id
                  type: INT
        - addForeignKeyConstraint:
            baseTableName: faculty_links
            baseColumnNames: faculty_id
            referencedTableName: faculties
            referencedColumnNames: id
            constraintName: fk_faculty_links_faculty
