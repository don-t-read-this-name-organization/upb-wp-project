databaseChangeLog:
  - changeSet:
      id: "07-create-faculty-links-table"
      author: "demesup"
      changes:
        - createTable:
            tableName: faculty_links
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
              - column:
                  name: url
                  type: VARCHAR(2000)
              - column:
                  name: category
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
